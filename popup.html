<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TB · Tripo Blender</title>
<style>
:root{color-scheme:dark;--yellow:#f9cf00;--bg:#171717;--panel:#242424;--text:#f5f5f5;--muted:#a8a8a8}
*{box-sizing:border-box}
body{margin:0;padding:17px;width:320px;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.logo{width:35px;height:35px;flex:0 0 35px}
h1{font-size:18px;line-height:1.15;letter-spacing:.2px;margin:0;font-weight:750}
h1 span{color:var(--yellow)}
.subtitle{font-size:12px;color:var(--muted);margin-top:3px}
button{display:block;width:100%;border:1px solid var(--yellow);border-radius:9px;background:var(--yellow);color:#171717;font-size:14px;font-weight:800;padding:12px 10px;cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.06)}button:disabled{opacity:.55;cursor:wait}
.status{display:none;margin-top:11px;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.status.visible{display:block}
.status.success{background:#14291b;color:#59d783;border:1px solid #245a35}
.status.warning{background:#302a10;color:var(--yellow);border:1px solid #6a5900}
.status.error{background:#301919;color:#ff7777;border:1px solid #713333}
</style>
</head>
<body>
<header>
<img src="icons/logo.png" alt="TB" class="logo">
<div><h1><span>Tripo</span color:var(--yellow> → Blender</h1><div class="subtitle">GLB для Blender</div></div>
</header>
<button id="go">Скачать модель .GLB</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
<script type="module" src="popup.js"></script>
</body>
</html>
